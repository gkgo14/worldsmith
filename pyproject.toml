[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldsmith"
version = "0.1.0"
description = "WorldSmith: Unified Agentic 3D and 4D Content Creation (preview: algorithmic components and pseudocode)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "WorldSmith authors" }]
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["worldsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
